[project]
name = "cli-tool"
version = "0.1.0"
description = ""
authors = [
    {name = "Tomás Taborda",email = "tomassantostaborda@gmail.com"}
]
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "click (>=8.5.0,<9.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "tool" }
]

[tool.poetry.scripts]
cli-tool = "tool.tool:cli"
